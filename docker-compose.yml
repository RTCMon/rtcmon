version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rtcmon
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrator:
    build:
      context: .
      dockerfile: services/ingest-api/Dockerfile
    entrypoint: ["/bin/ingest-api", "migrate", "up"]
    environment:
      DB_URL: postgres://postgres:postgres@postgres:5432/rtcmon
    volumes:
      - ./config.yaml:/config.yaml
    depends_on:
      postgres:
        condition: service_healthy

  ingest-api:
    build:
      context: .
      dockerfile: services/ingest-api/Dockerfile
    volumes:
      - ./config.yaml:/config.yaml
    ports:
      - "8080:8080"
    depends_on:
      migrator:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  query-api:
    build:
      context: .
      dockerfile: services/query-api/Dockerfile
    volumes:
      - ./config.yaml:/config.yaml
    ports:
      - "8081:8081"
    depends_on:
      migrator:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
